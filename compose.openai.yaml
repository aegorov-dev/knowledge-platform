
services:
  indexing-service:
    environment:
      - 'KNOWLEDGE_PLATFORM_EMBEDDING_PROVIDER=openai'
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}:'

  rag-service:
    environment:
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}:'
      - 'OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}'
      - 'OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}'
      - 'OPENAI_EMBEDDING_DIMENSIONS=${OPENAI_EMBEDDING_DIMENSIONS:-768}'
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AI_CHAT_CLIENT_ADVISOR=DEBUG
      - OPENAI_LOG=debug
      - 'EMBEDDING_PROVIDER=openai'
      - 'LLM_PROVIDER=openai'