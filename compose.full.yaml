# Full-stack demo: `docker compose -f compose.full.yaml up --build` boots
# postgres (pgvector) + kafka + all three services + the UI, wired with stub
# providers so it runs fully offline with no API keys.
#
# The lighter compose.yaml (postgres + kafka only) is still used for local
# `./mvnw spring-boot:run` development against the dev profile.
services:
  postgres:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=knowledge_platform'
      - 'POSTGRES_PASSWORD=knowledge_platform'
      - 'POSTGRES_USER=knowledge_platform'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knowledge_platform -d knowledge_platform']
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: 'apache/kafka-native:latest'
    environment:
      - 'KAFKA_NODE_ID=1'
      - 'KAFKA_PROCESS_ROLES=broker,controller'
      - 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER'
      # Two broker listeners: INTERNAL for other containers (kafka:9092),
      # EXTERNAL for the host (localhost:19092).
      - 'KAFKA_LISTENERS=CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:19092'
      - 'KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:19092'
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      - 'KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL'
      - 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093'
      - 'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1'
      - 'KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1'
      - 'KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1'
      - 'KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0'
      - 'KAFKA_AUTO_CREATE_TOPICS_ENABLE=true'
    ports:
      - '19092:19092'

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/knowledge_platform'
      - 'SPRING_DATASOURCE_USERNAME=knowledge_platform'
      - 'SPRING_DATASOURCE_PASSWORD=knowledge_platform'
      - 'SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092'
      # Shared uploads volume (see below) — document-service WRITES here.
      - 'KNOWLEDGE_PLATFORM_STORAGE_ROOT=/var/lib/knowledge-platform/storage'
    volumes:
      - 'uploads:/var/lib/knowledge-platform/storage'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/8080"']
      interval: 10s
      timeout: 5s
      retries: 20

  indexing-service:
    build:
      context: .
      dockerfile: indexing-service/Dockerfile
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/knowledge_platform'
      - 'SPRING_DATASOURCE_USERNAME=knowledge_platform'
      - 'SPRING_DATASOURCE_PASSWORD=knowledge_platform'
      - 'SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092'
      # Shared uploads volume — indexing-service READS what document-service wrote.
      - 'KNOWLEDGE_PLATFORM_STORAGE_ROOT=/var/lib/knowledge-platform/storage'
      # Keep this in sync with rag-service: query and chunk embeddings must use the
      # same provider/model/dimensions or retrieval breaks. Default offline stub.
      - 'KNOWLEDGE_PLATFORM_EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-stub}'
      - 'OPENAI_API_KEY=${OPENAI_API_KEY:-}'
      - 'OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}'
      - 'OPENAI_EMBEDDING_DIMENSIONS=${OPENAI_EMBEDDING_DIMENSIONS:-768}'
    volumes:
      - 'uploads:/var/lib/knowledge-platform/storage'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  rag-service:
    build:
      context: .
      dockerfile: rag-service/Dockerfile
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/knowledge_platform'
      - 'SPRING_DATASOURCE_USERNAME=knowledge_platform'
      - 'SPRING_DATASOURCE_PASSWORD=knowledge_platform'
      - 'EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-stub}'
      - 'LLM_PROVIDER=${LLM_PROVIDER:-stub}'
      - 'DOCUMENT_LINK_BASE=${DOCUMENT_LINK_BASE:-http://localhost:8080/api/v1/documents/{documentId}}'
      - 'OPENAI_API_KEY=${OPENAI_API_KEY:-}'
      - 'OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}'
      - 'OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}'
      - 'OPENAI_EMBEDDING_DIMENSIONS=${OPENAI_EMBEDDING_DIMENSIONS:-768}'
      - 'AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}'
      - 'AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}'
      - 'AZURE_OPENAI_CHAT_DEPLOYMENT=${AZURE_OPENAI_CHAT_DEPLOYMENT:-}'
      - 'AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}'
    ports:
      - '8082:8082'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/8082"']
      interval: 10s
      timeout: 5s
      retries: 20

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - '8088:80'
    depends_on:
      document-service:
        condition: service_started
      rag-service:
        condition: service_started

volumes:
  # The one deliberate piece of local coupling: document-service and
  # indexing-service share this named volume for uploaded files.
  uploads:
